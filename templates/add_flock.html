{% extends "base.html" %}

{% block title %}Add Flock - FARMLINK POULTRY{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <h2><i class="bi bi-plus-circle me-2"></i>Create New Flock</h2>
        <hr>

        <form method="POST" action="{{ url_for('add_flock') }}">
            <div class="mb-3">
                <label for="batch_name" class="form-label fw-bold">Batch Name</label>
                <input type="text" class="form-control" id="batch_name" name="batch_name"
                       placeholder="e.g., Batch A - Jan 2026" required>
            </div>

            <div class="mb-3">
                <label for="start_date" class="form-label fw-bold">Start Date</label>
                <input type="date" class="form-control" id="start_date" name="start_date" required>
            </div>

            <div class="mb-3">
                <label for="total_initial_birds" class="form-label fw-bold">Total Initial Birds</label>
                <input type="number" class="form-control" id="total_initial_birds"
                       name="total_initial_birds" min="1" value="1" required>
            </div>

            <button type="submit" class="btn btn-success">
                <i class="bi bi-check-circle me-1"></i>Create Flock
            </button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
