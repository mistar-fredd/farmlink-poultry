{% extends "base.html" %}

{% block title %}Add Health Record - FARMLINK POULTRY{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <h2><i class="bi bi-heart-pulse me-2"></i>Add Health Record</h2>
        <p class="text-muted">Recording health data for bird: <strong>{{ leg_band_number }}</strong></p>
        <hr>

        <form method="POST" action="{{ url_for('add_health_record', leg_band_number=leg_band_number) }}">
            <div class="mb-3">
                <label for="record_date" class="form-label fw-bold">Date</label>
                <input type="date" class="form-control" id="record_date" name="record_date" required>
            </div>

            <div class="mb-3">
                <label for="disease" class="form-label fw-bold">Disease / Condition</label>
                <input type="text" class="form-control" id="disease" name="disease"
                       placeholder="e.g., Newcastle Disease, Coccidiosis">
                <div class="form-text">Leave blank if this is a routine check-up.</div>
            </div>

            <div class="mb-3">
                <label for="treatment" class="form-label fw-bold">Treatment</label>
                <input type="text" class="form-control" id="treatment" name="treatment"
                       placeholder="e.g., Antibiotics, Vaccination">
            </div>

            <div class="mb-3">
                <label for="notes" class="form-label fw-bold">Notes</label>
                <textarea class="form-control" id="notes" name="notes" rows="3"
                          placeholder="Additional observations..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-circle me-1"></i>Save Record
            </button>
            <a href="{{ url_for('bird_profile', leg_band_number=leg_band_number) }}"
               class="btn btn-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
